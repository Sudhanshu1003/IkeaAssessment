name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Stage 1: Build and Test
  build-test:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build project
      run: ./mvnw clean compile

    - name: Run tests with coverage
      run: ./mvnw clean test jacoco:report

    - name: Extract coverage percentage
      id: coverage
      run: |
        if [ -f "target/site/jacoco/jacoco.xml" ]; then
          COVERAGE=$(grep -o 'Total.*[0-9]\+%' target/site/jacoco/index.html | grep -o '[0-9]\+' | head -1)
          echo "percentage=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "📊 Current coverage: ${COVERAGE}%"
          
          if [ "${COVERAGE}" -lt 80 ]; then
            echo "❌ Coverage below 80% threshold (current: ${COVERAGE}%)"
            exit 1
          else
            echo "✅ Coverage meets 80% threshold (current: ${COVERAGE}%)"
          fi
        else
          echo "❌ JaCoCo report not found"
          exit 1
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ github.run_number }}
        path: |
          target/surefire-reports/
          target/failsafe-reports/
        retention-days: 7

    - name: Upload JaCoCo coverage report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: jacoco-report-${{ github.run_number }}
        path: target/site/jacoco/
        retention-days: 30

    - name: Build application package
      run: ./mvnw package -DskipTests

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts-${{ github.run_number }}
        path: |
          target/*.jar
          target/quarkus-app/
        retention-days: 7

  # Stage 2: Code Quality
  code-quality:
    runs-on: ubuntu-latest
    needs: build-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run SpotBugs static analysis
      run: ./mvnw spotbugs:check

    - name: Run Checkstyle
      run: ./mvnw checkstyle:check

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Stage 3: Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'warehouse-app'
        path: '.'
        format: 'HTML'

    - name: Upload OWASP results
      uses: actions/upload-artifact@v3
      with:
        name: owasp-reports-${{ github.run_number }}
        path: reports/

  # Stage 4: Docker Build
  docker-build:
    runs-on: ubuntu-latest
    needs: [build-test, code-quality, security-scan]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts-${{ github.run_number }}
        path: target/

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/main/docker/Dockerfile.jvm
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        format: spdx-json
        output-file: sbom.spdx.json

    - name: Upload SBOM
      uses: actions/upload-artifact@v3
      with:
        name: sbom-${{ github.run_number }}
        path: sbom.spdx.json

  # Stage 5: Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: warehouse_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run integration tests
      run: ./mvnw verify -Pintegration-tests
      env:
        QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/warehouse_test
        QUARKUS_DATASOURCE_USERNAME: test
        QUARKUS_DATASOURCE_PASSWORD: test

    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results-${{ github.run_number }}
        path: target/failsafe-reports/

  # Stage 6: Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build, integration-tests]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment"
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop"
        # Add your staging deployment commands here
        # For example: kubectl apply -f k8s/staging/

    - name: Health check staging
      run: |
        echo "🔍 Performing health check on staging"
        # Add health check commands here

  # Stage 7: Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build, integration-tests]
    if: github.event_name == 'release'
    environment: production

    steps:
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment"
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        # Add your production deployment commands here
        # For example: kubectl apply -f k8s/production/

    - name: Health check production
      run: |
        echo "🔍 Performing health check on production"
        # Add health check commands here

  # Stage 8: Performance Tests
  performance-tests:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run K6 performance tests
      uses: grafana/k6-action@v0.3.0
      with:
        filename: performance-tests/load-test.js

    - name: Upload performance test results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results-${{ github.run_number }}
        path: performance-results/

  # Stage 9: Notification
  notify:
    runs-on: ubuntu-latest
    needs: [build-test, code-quality, security-scan, docker-build, integration-tests]
    if: always()

    steps:
    - name: Pipeline Summary
      run: |
        echo "📊 Pipeline Summary"
        echo "=================="
        echo "Build & Test: ${{ needs.build-test.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        echo "Docker Build: ${{ needs.docker-build.result }}"
        echo "Integration Tests: ${{ needs.integration-tests.result }}"
        echo "Coverage: ${{ needs.build-test.outputs.coverage }}%"

    - name: Notify Slack (if configured)
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#ci-cd'
        text: |
          Pipeline Status: ${{ job.status }}
          Branch: ${{ github.ref }}
          Commit: ${{ github.sha }}
          Coverage: ${{ needs.build-test.outputs.coverage }}%
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
