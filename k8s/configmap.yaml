apiVersion: v1
kind: ConfigMap
metadata:
  name: warehouse-config
  namespace: warehouse-staging
data:
  application.properties: |
    quarkus.http.port=8080
    quarkus.http.host=0.0.0.0
    quarkus.datasource.db-kind=postgresql
    quarkus.datasource.jdbc-url=jdbc:postgresql://postgres-service:5432/warehouse_staging
    quarkus.datasource.username=warehouse
    quarkus.datasource.password=warehouse123
    quarkus.hibernate-orm.database.generation=validate
    quarkus.log.level=INFO
    quarkus.smallrye-health.root-path=/q/health
    quarkus.smallrye-metrics.path=/q/metrics
    quarkus.swagger-ui.path=/swagger-ui
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: warehouse-config
  namespace: warehouse-production
data:
  application.properties: |
    quarkus.http.port=8080
    quarkus.http.host=0.0.0.0
    quarkus.datasource.db-kind=postgresql
    quarkus.datasource.jdbc-url=jdbc:postgresql://postgres-service:5432/warehouse
    quarkus.datasource.username=warehouse
    quarkus.datasource.password=warehouse123
    quarkus.hibernate-orm.database.generation=validate
    quarkus.log.level=WARN
    quarkus.smallrye-health.root-path=/q/health
    quarkus.smallrye-metrics.path=/q/metrics
    quarkus.swagger-ui.path=/swagger-ui
