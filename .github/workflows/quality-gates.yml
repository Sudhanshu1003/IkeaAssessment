name: Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Code Quality Checks
  quality-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run tests with coverage
      run: ./mvnw clean verify jacoco:report

    - name: Check coverage threshold (80%)
      run: |
        echo "🔍 Checking JaCoCo coverage report..."
        if [ -f "target/site/jacoco/jacoco.xml" ]; then
          COVERAGE=$(grep -o 'Total.*[0-9]\+%' target/site/jacoco/index.html | grep -o '[0-9]\+' | head -1)
          echo "📊 Current coverage: ${COVERAGE}%"
          
          if [ "${COVERAGE}" -lt 80 ]; then
            echo "❌ Coverage below 80% threshold (current: ${COVERAGE}%)"
            echo "📋 Coverage Report Summary:"
            grep -A 10 "TOTAL" target/site/jacoco/jacoco.csv || echo "No CSV report found"
            exit 1
          else
            echo "✅ Coverage meets 80% threshold (current: ${COVERAGE}%)"
          fi
        else
          echo "❌ JaCoCo report not found at target/site/jacoco/jacoco.xml"
          exit 1
        fi

    - name: Upload JaCoCo coverage report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: quality-gates-coverage-report
        path: target/site/jacoco/
        retention-days: 7

    - name: Run SpotBugs static analysis
      run: ./mvnw spotbugs:check

    - name: Run Checkstyle
      run: ./mvnw checkstyle:check

    - name: Check for TODO comments
      run: |
        TODO_COUNT=$(grep -r "TODO" src/ --include="*.java" | wc -l)
        echo "Found $TODO_COUNT TODO comments"
        if [ "$TODO_COUNT" -gt 5 ]; then
          echo "❌ Too many TODO comments ($TODO_COUNT > 5)"
          exit 1
        fi

    - name: Check code complexity
      run: |
        echo "Checking code complexity..."
        # Add complexity checks here if needed

    - name: Quality gate summary
      run: |
        echo "✅ All quality gates passed"
        echo "✅ Coverage threshold met"
        echo "✅ Static analysis passed"
        echo "✅ Code style checks passed"

  # Performance Quality Checks
  performance-gates:
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build application
      run: ./mvnw package -DskipTests

    - name: Run application startup performance test
      run: |
        echo "Testing application startup performance..."
        timeout 30s ./mvnw quarkus:dev -Dquarkus.http.port=8081 &
        APP_PID=$!
        sleep 10
        
        # Check if application started within 10 seconds
        if curl -f http://localhost:8081/q/health; then
          echo "✅ Application started within 10 seconds"
        else
          echo "❌ Application failed to start within 10 seconds"
          kill $APP_PID
          exit 1
        fi
        
        kill $APP_PID

    - name: Memory usage check
      run: |
        echo "Checking memory usage..."
        # Add memory usage checks here if needed

  # Documentation Quality
  documentation-gates:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check README exists
      run: |
        if [ -f README.md ]; then
          echo "✅ README.md exists"
        else
          echo "❌ README.md missing"
          exit 1
        fi

    - name: Check API documentation
      run: |
        if [ -f "src/main/resources/openapi/warehouse-openapi.yaml" ]; then
          echo "✅ OpenAPI documentation exists"
        else
          echo "❌ OpenAPI documentation missing"
          exit 1
        fi

    - name: Validate OpenAPI spec
      run: |
        echo "Validating OpenAPI specification..."
        # Add OpenAPI validation here if needed

    - name: Check for documentation coverage
      run: |
        echo "Checking documentation coverage..."
        # Add documentation coverage checks here
